services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: classifieds-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    container_name: classifieds-dev

    working_dir: /workspace

    volumes:
      - .:/workspace

    command: sleep infinity

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DBJornal;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

    ports:
      - "5041:5041"
      - "3000:3000"

volumes:
  sqlserver_data: