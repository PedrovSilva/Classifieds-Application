name: Frontend CI

on:
  push:
    branches:
      - main
      - frontend-refactor
  pull_request:
    branches:
      - main
      - frontend-refactor

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: classificados-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: classificados-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:5041/api