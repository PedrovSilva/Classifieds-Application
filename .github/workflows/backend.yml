name: Backend CI

on:
  push:
    branches:
      - main
      - frontend-refactor
  pull_request:
    branches:
      - main
      - frontend-refactor

jobs:
  build-and-test:
    name: Build and Test .NET API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ClassificadosApi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test ../ClassificadosApi.Tests/ClassificadosApi.Tests.csproj --configuration Release --no-restore --verbosity normal