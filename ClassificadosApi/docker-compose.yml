services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: classifieds-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Classifieds123!StrongPassword"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Classifieds123!StrongPassword' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: classifieds-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "
      rm -rf obj bin &&
      dotnet restore &&
      dotnet ef database update &&
      dotnet run --project . --urls http://0.0.0.0:5041
      "
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DBJornal;User Id=sa;Password=Classifieds123!StrongPassword;TrustServerCertificate=True"
    ports:
      - "5041:5041"
      - "5000:5000"
      - "3000:3000"

volumes:
  sqlserver_data:
